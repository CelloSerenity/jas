name: Build

on:
  workflow_dispatch:
  push:
  pull_request: 

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-26.04-arm
          - os: xcode-27
          - os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and git dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Install cargo-leptos
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-leptos

      - name: Build with leptos
        run: cargo leptos build --release

      - name: Stage build artifacts
        shell: bash
        run: |
          mkdir -p dist/target
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/jas.exe dist/jas.exe
          else
            cp target/release/jas dist/jas
          fi
          cp -r target/site dist/target/site

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: jas-${{ runner.os }}-${{ runner.arch }}
          path: dist

  nightly:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: nightly-release
      cancel-in-progress: false

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: jas-*
          path: artifacts

      - name: Package ZIPs
        run: |
          mkdir dist
          for artifact in artifacts/jas-*; do
            name="${artifact##*/}"
            if [ -f "$artifact/jas" ]; then
              chmod +x "$artifact/jas"
            fi
            (cd "$artifact" && zip -qr "$GITHUB_WORKSPACE/dist/$name.zip" .)
          done

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload nightly dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" \
              -f sha="$GITHUB_SHA" -F force=true
            gh release edit nightly --notes "Built from $GITHUB_SHA" --prerelease --latest=false \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create nightly dist/*.zip --target "$GITHUB_SHA" \
              --title Nightly --notes "Built from $GITHUB_SHA" --prerelease --latest=false \
              --repo "$GITHUB_REPOSITORY"
          fi
